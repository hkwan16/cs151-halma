  <script type="text/javascript">
function renderstate(state) {
  var step = compfindx('N', seq('step', 'N'), state, library);
  var role = compfindx('R', seq('control', 'R'), state, library);
  var table = document.createElement('table');
  table.setAttribute('border', '0');
  table.setAttribute('cellspacing', '0');
  table.setAttribute('cellpadding', '6');

  var row = table.insertRow(0);
  var cell = row.insertCell(0);
  cell.setAttribute('align', 'center');
  cell.setAttribute('style', 'font-size:20px;font-weight:bold');
  cell.innerHTML = 'Halma - Step: ' + step;

  row = table.insertRow(1);
  cell = row.insertCell(0);
  cell.appendChild(renderboard(state));

  row = table.insertRow(2);
  cell = row.insertCell(0);
  cell.setAttribute('align', 'center');
  cell.setAttribute('style', 'font-size:18px');
  if (compfindp('terminal', state, library)) {
    cell.innerHTML = 'Game over';
  } else {
    cell.innerHTML = 'Control: ' + role;
  }
  return table;
}

function renderboard(state) {
  var table = document.createElement('table');
  table.setAttribute('cellspacing', '0');
  table.setAttribute('cellpadding', '0');
  table.setAttribute('class', 'halma-board');
  for (var r = 1; r <= 16; r++) {
    var row = table.insertRow(r - 1);
    for (var c = 1; c <= 16; c++) {
      var cell = row.insertCell(c - 1);
      cell.setAttribute('class', yardClass(r, c));
      cell.appendChild(renderpiece(r, c, state));
    }
  }
  return table;
}

function renderpiece(r, c, state) {
  var mark = compfindx('X', seq('cell', String(r), String(c), 'X'), state, library);
  var piece = document.createElement('div');
  piece.setAttribute('class', 'piece ' + mark);
  if (mark === 'red' || mark === 'blue') {
    piece.innerHTML = '&nbsp;';
  }
  return piece;
}

function yardClass(r, c) {
  if (isRedYard(r, c)) { return 'red-yard'; }
  if (isBlueYard(r, c)) { return 'blue-yard'; }
  return '';
}

function isRedYard(r, c) {
  return (r === 1 && c <= 5) ||
         (r === 2 && c <= 5) ||
         (r === 3 && c <= 4) ||
         (r === 4 && c <= 3) ||
         (r === 5 && c <= 2);
}

function isBlueYard(r, c) {
  return (r === 16 && c >= 12) ||
         (r === 15 && c >= 12) ||
         (r === 14 && c >= 13) ||
         (r === 13 && c >= 14) ||
         (r === 12 && c >= 15);
}

legal(move(R,C,ER,EC)) :- control(Player) &amp; movable(Player,R,C,ER,EC)

movable(Player,R,C,ER,EC) :- cell(R,C,Player) &amp; adjacent(R,C,ER,EC) &amp; cell(ER,EC,blank)
movable(Player,R,C,ER,EC) :- cell(R,C,Player) &amp; hop1(R,C,ER,EC)

hop1(SR,SC,ER,EC) :- segment(SR,SC,SR,SC,ER,EC)
hop2(SR,SC,ER,EC) :- segment(SR,SC,SR,SC,A,B) &amp; segment(SR,SC,A,B,ER,EC)
hop3(SR,SC,ER,EC) :- segment(SR,SC,SR,SC,A,B) &amp; segment(SR,SC,A,B,D,E) &amp; segment(SR,SC,D,E,ER,EC)
hop4(SR,SC,ER,EC) :- segment(SR,SC,SR,SC,A,B) &amp; segment(SR,SC,A,B,D,E) &amp; segment(SR,SC,D,E,F,G) &amp; segment(SR,SC,F,G,ER,EC)
hop5(SR,SC,ER,EC) :- segment(SR,SC,SR,SC,A,B) &amp; segment(SR,SC,A,B,D,E) &amp; segment(SR,SC,D,E,F,G) &amp; segment(SR,SC,F,G,H,I) &amp; segment(SR,SC,H,I,ER,EC)
hop6(SR,SC,ER,EC) :- segment(SR,SC,SR,SC,A,B) &amp; segment(SR,SC,A,B,D,E) &amp; segment(SR,SC,D,E,F,G) &amp; segment(SR,SC,F,G,H,I) &amp; segment(SR,SC,H,I,J,K) &amp; segment(SR,SC,J,K,ER,EC)

segment(SR,SC,R,C,ER,EC) :- hop(R,C,MR,MC,ER,EC) &amp; notorigin(SR,SC,MR,MC) &amp; cell(MR,MC,P) &amp; distinct(P,blank) &amp; cell(ER,EC,blank)
notorigin(SR,SC,MR,MC) :- coordinate(SR,SC) &amp; coordinate(MR,MC) &amp; distinct(SR,MR)
notorigin(SR,SC,MR,MC) :- coordinate(SR,SC) &amp; coordinate(MR,MC) &amp; distinct(SC,MC)
