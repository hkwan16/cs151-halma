  <script type="text/javascript">
function renderstate(state) {
  var step = compfindx('N', seq('step', 'N'), state, library);
  var role = compfindx('R', seq('control', 'R'), state, library);
  var table = document.createElement('table');
  table.setAttribute('border', '0');
  table.setAttribute('cellspacing', '0');
  table.setAttribute('cellpadding', '6');

  var row = table.insertRow(0);
  var cell = row.insertCell(0);
  cell.setAttribute('align', 'center');
  cell.setAttribute('style', 'font-size:20px;font-weight:bold');
  cell.innerHTML = 'Halma (2 players) - Step: ' + step;

  row = table.insertRow(1);
  cell = row.insertCell(0);
  cell.appendChild(renderboard(state));

  row = table.insertRow(2);
  cell = row.insertCell(0);
  cell.setAttribute('align', 'center');
  cell.setAttribute('style', 'font-size:18px');
  if (compfindp('terminal', state, library)) {
    cell.innerHTML = 'Game over';
  } else {
    cell.innerHTML = 'Control: ' + role;
  }
  return table;
}

var selectedMoveStart = null;

function renderactions(currentState) {
  var panel = document.createElement('div');
  panel.setAttribute('class', 'action-panel');

  var message = document.createElement('div');
  message.setAttribute('id', 'move-message');

  if (findterminalp(currentState, library)) {
    message.innerHTML = 'Game over.';
  } else {
    var role = compfindx('R', seq('control', 'R'), currentState, library);
    message.innerHTML = 'Drag a ' + role + ' piece to an empty legal destination.';
  }

  panel.appendChild(message);
  return panel;
}

function renderboard(state) {
  var table = document.createElement('table');
  table.setAttribute('cellspacing', '0');
  table.setAttribute('cellpadding', '0');
  table.setAttribute('class', 'halma-board');
  for (var r = 1; r <= 8; r++) {
    var row = table.insertRow(r - 1);
    for (var c = 1; c <= 8; c++) {
      var cell = row.insertCell(c - 1);
      cell.setAttribute('class', yardClass(r, c));
      cell.setAttribute('data-row', String(r));
      cell.setAttribute('data-col', String(c));
      cell.addEventListener('dragover', handleDragOver);
      cell.addEventListener('dragleave', handleDragLeave);
      cell.addEventListener('drop', handleDrop);
      cell.addEventListener('click', handleCellClick);
      cell.appendChild(renderpiece(r, c, state));
    }
  }
  return table;
}

function renderpiece(r, c, state) {
  var mark = compfindx('X', seq('cell', String(r), String(c), 'X'), state, library);
  var control = compfindx('R', seq('control', 'R'), state, library);
  var piece = document.createElement('div');
  piece.setAttribute('class', 'piece ' + mark);
  piece.setAttribute('data-row', String(r));
  piece.setAttribute('data-col', String(c));
  if (mark === 'red' || mark === 'blue') {
    piece.innerHTML = '&nbsp;';
  }
  if (mark === control && !findterminalp(state, library)) {
    piece.setAttribute('draggable', 'true');
    piece.setAttribute('title', 'Drag to move');
    piece.addEventListener('dragstart', handleDragStart);
    piece.addEventListener('dragend', handleDragEnd);
  }
  return piece;
}

function handleDragStart(event) {
  var row = event.currentTarget.getAttribute('data-row');
  var col = event.currentTarget.getAttribute('data-col');
  selectedMoveStart = {row: row, col: col};
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', row + ',' + col);
  setSelectedCell(row, col);
}

function handleDragEnd() {
  clearDragHighlights();
}

function handleDragOver(event) {
  event.preventDefault();
  event.currentTarget.classList.add('drag-over');
  if (event.dataTransfer) {
    event.dataTransfer.dropEffect = 'move';
  }
}

function handleDragLeave(event) {
  event.currentTarget.classList.remove('drag-over');
}

function handleDrop(event) {
  event.preventDefault();
  var target = event.currentTarget;
  target.classList.remove('drag-over');

  var source = event.dataTransfer.getData('text/plain').split(',');
  if (source.length !== 2) {
    flashInvalid(target);
    return;
  }

  executeMoveFromTo(source[0], source[1], target.getAttribute('data-row'), target.getAttribute('data-col'), target);
}

function handleCellClick(event) {
  if (findterminalp(state, library)) {
    return;
  }

  var cell = event.currentTarget;
  var row = cell.getAttribute('data-row');
  var col = cell.getAttribute('data-col');
  var mark = compfindx('X', seq('cell', row, col, 'X'), state, library);
  var control = compfindx('R', seq('control', 'R'), state, library);

  if (mark === control) {
    selectedMoveStart = {row: row, col: col};
    setSelectedCell(row, col);
    showMoveMessage('Selected ' + control + ' piece at (' + row + ', ' + col + '). Click a legal destination.');
    return;
  }

  if (selectedMoveStart) {
    executeMoveFromTo(selectedMoveStart.row, selectedMoveStart.col, row, col, cell);
  }
}

function executeMoveFromTo(startRow, startCol, endRow, endCol, targetCell) {
  var action = findLegalMove(startRow, startCol, endRow, endCol);
  if (action) {
    selectedMoveStart = null;
    perform(action);
    return true;
  }

  flashInvalid(targetCell);
  showMoveMessage('Invalid move. Try a highlighted player piece and an empty legal destination.');
  return false;
}

function findLegalMove(startRow, startCol, endRow, endCol) {
  var moveText = 'move(' + startRow + ',' + startCol + ',' + endRow + ',' + endCol + ')';
  var action = read(moveText);
  if (findlegalp(action, state, library)) {
    return action;
  }
  return null;
}

function setSelectedCell(row, col) {
  clearSelectedCell();
  var cell = document.querySelector('.halma-board td[data-row="' + row + '"][data-col="' + col + '"]');
  if (cell) {
    cell.classList.add('selected');
  }
}

function clearSelectedCell() {
  var cells = document.querySelectorAll('.halma-board td.selected');
  for (var i = 0; i < cells.length; i++) {
    cells[i].classList.remove('selected');
  }
}

function clearDragHighlights() {
  var cells = document.querySelectorAll('.halma-board td.drag-over');
  for (var i = 0; i < cells.length; i++) {
    cells[i].classList.remove('drag-over');
  }
}

function flashInvalid(cell) {
  if (!cell) {
    return;
  }
  cell.classList.add('invalid');
  setTimeout(function() {
    cell.classList.remove('invalid');
  }, 350);
}

function showMoveMessage(text) {
  var message = document.getElementById('move-message');
  if (message) {
    message.innerHTML = text;
  }
}

function yardClass(r, c) {
  if (isRedYard(r, c)) { return 'red-yard'; }
  if (isBlueYard(r, c)) { return 'blue-yard'; }
  return '';
}

function isRedYard(r, c) {
  return (r === 1 && c <= 4) ||
         (r === 2 && c <= 3) ||
         (r === 3 && c <= 2) ||
         (r === 4 && c <= 1);
}

function isBlueYard(r, c) {
  return (r === 8 && c >= 5) ||
         (r === 7 && c >= 6) ||
         (r === 6 && c >= 7) ||
         (r === 5 && c >= 8);
}
